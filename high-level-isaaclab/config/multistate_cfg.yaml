# Simulation configuration
sim:
  device: "cuda:0"
  dt: 0.008333  # 1/120
  gravity: [0.0, 0.0, -9.81]
  physx:
    solver_type: 1
    max_position_iteration_count: 4
    max_velocity_iteration_count: 0
    bounce_threshold_velocity: 0.2
    gpu_max_rigid_contact_count: 8388608  # 2^23

# Scene configuration
scene:
  ground_plane: true
  ground_plane_height: 0.0
  ground_plane_size: 100.0
  ground_plane_color: [0.2, 0.2, 0.2]

# Environment configuration
env:
  num_envs: 34
  max_episode_length: 1500
  control_frequency: 60
  enable_debug_vis: false
  camera_mode: "full"
  small_value_set_zero: false
  last_commands: false
  record_video: false
  use_tanh: false
  near_goal_stop: false
  obj_move_prob: 0.0

# Robot configuration
robot:
  urdf_path: "path/to/robot.urdf"  # Update with actual path
  initial_position: [-2.00, 0, 0.55]
  initial_orientation: [0, 0, 0, 1]
  fixed_base: false
  joint_damping: 0.1
  joint_friction: 0.1
  joint_limits:
    lower: [-1.0] * num_joints  # Update with actual joint limits
    upper: [1.0] * num_joints   # Update with actual joint limits

# Feature configuration
features:
  num_features: 1024
  encode_dim: 128
  no_feature: false

# Training configuration
training:
  wandb: false
  wandb_project: "isaac-lab-multistate"
  wandb_name: "multistate-training"
  experiment_dir: "experiments"
  timesteps: 1000000
  headless: true 